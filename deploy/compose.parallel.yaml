# Parallel test deployment of go-proxy-manager ALONGSIDE an existing Nginx Proxy
# Manager install. It deliberately uses non-conflicting ports and never touches
# NPM's 80/443/81, its data, or DNS. Use it to validate the import + all features
# before any cutover.
#
#   Admin UI/API : 127.0.0.1:8081  (localhost-only by design - not exposed)
#   Data plane   : 8880 (http) / 8843 (https)
#
# Ports are chosen to avoid existing services on this host (e.g. service-x on
# 8080). Adjust the GPM_* env + ports below if any still collide.
#
# Quick start (see deploy/parallel-testing.md for the full runbook):
#   export GPM_ADMIN_HASH="$(docker run --rm <image> hashpw 'choose-a-strong-pass')"
#   docker compose -f deploy/compose.parallel.yaml run --rm \
#       -v /srv/npm-data-copy:/npm:ro gpm import --npm-data /npm --dry-run
#   docker compose -f deploy/compose.parallel.yaml up -d

name: gpm-test

services:
  gpm:
    build:
      context: ..
      dockerfile: Dockerfile
    # Or pin the CI-built image instead of building locally:
    # image: ghcr.io/rake-pro/go-proxy-manager:main
    container_name: gpm-test
    restart: unless-stopped
    environment:
      GPM_CONFIG_DIR: /data/config
      GPM_CERT_DIR: /data/certs
      GPM_SESSION_DB: /data/session.db
      GPM_ADMIN_ADDR: ":8081"
      GPM_HTTPS_ADDR: ":8843"
      GPM_HTTP_ADDR: ":8880"
      GPM_LOG_CONSOLE: "1"
      # Break-glass admin for testing. Generate with: gpm hashpw '<password>'
      GPM_LOCAL_ADMIN_USER: admin
      GPM_LOCAL_ADMIN_PASSWORD_HASH: ${GPM_ADMIN_HASH:?set GPM_ADMIN_HASH - run: gpm hashpw '<password>'}
      # Admin is reached over plain http on localhost during testing, so the
      # Secure cookie flag is off. Set to 1 once the admin is fronted by https.
      GPM_COOKIE_SECURE: "0"
      # Only needed if you test live ACME issuance (use LE STAGING first).
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    ports:
      - "127.0.0.1:8081:8081" # admin - localhost only
      - "8880:8880"           # data plane http
      - "8843:8843"           # data plane https
    volumes:
      - gpm-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  gpm-data:
