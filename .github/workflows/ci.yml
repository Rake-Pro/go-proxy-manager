name: CI

# No paths filters: the "build" check is required on dev -> main promotion PRs, so it
# must exist on every dev SHA - a filtered-out push would block promotion.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    permissions:
      contents: read
      packages: write
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the dev version is derived from the last
          # release tag and the commit count since it.
          fetch-depth: 0

      # Dev builds carry a semver pre-release version: the next patch after the
      # latest release, then -dev.N where N counts commits since that release
      # (so 2.1.1-dev.3 sorts below 2.1.1 and below any 2.2.0, and every dev
      # commit gets its own tag). Releases keep X.Y.Z; a host that chooses to run
      # the dev channel pins one of these.
      - name: Dev version
        id: ver
        run: |
          set -euo pipefail
          base=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$base" ]; then
            n=$(git rev-list --count "${base}..HEAD")
          else
            base=v0.0.0; n=$(git rev-list --count HEAD)
          fi
          IFS=. read -r major minor patch <<<"${base#v}"
          version="${major}.${minor}.$((patch + 1))-dev.${n}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "dev version ${version} (${n} commits since ${base})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Runs on every push to dev so the "build" check lands on the SHA the
      # dev -> main PR points at. Push events also publish the dev image
      # (:dev, floating, and :X.Y.Z-dev.N); pull requests only validate the
      # build.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ steps.ver.outputs.version }}

      - name: Build (push dev image on push events)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.ver.outputs.date }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: final

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      # staticcheck is a go.mod tool dependency (go tool) rather than `go run pkg@ver`:
      # Go 1.27.2 backported unified V5 export data (golang/go#81188) and the x/tools
      # bundled by staticcheck v0.8.1 cannot read it; resolving x/tools through our
      # go.mod (>= v0.50.0) fixes the import without waiting for a staticcheck release.
      - name: staticcheck
        run: go tool staticcheck ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
