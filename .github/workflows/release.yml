name: Release

on:
  # Normal path: a promotion PR merges into prod; this run mints the next
  # semver tag and builds from it, all in one workflow (a tag pushed with
  # GITHUB_TOKEN cannot trigger another workflow, so nothing is chained).
  push:
    branches: [prod]
    tags: ["v*"]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/rake-pro/go-proxy-manager

jobs:
  version:
    if: github.ref_type == 'branch'
    permissions:
      contents: write # push the release tag
      pull-requests: read # PR labels choose the bump level
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute and push next version tag
        id: next
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
            echo "HEAD already tagged; skipping release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "${latest}" ]; then
            next="v1.0.0"
          else
            labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[].labels[].name] | join(",")' || echo "")
            bump=patch
            case ",${labels}," in
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
            esac
            IFS=. read -r ma mi pa <<< "${latest#v}"
            case "${bump}" in
              major) next="v$((ma+1)).0.0" ;;
              minor) next="v${ma}.$((mi+1)).0" ;;
              patch) next="v${ma}.${mi}.$((pa+1))" ;;
            esac
          fi

          git tag "${next}" "${GITHUB_SHA}"
          git push origin "refs/tags/${next}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (OIDC)
    # Runs for a freshly minted tag (prod merge) or a manually pushed v* tag.
    if: always() && (needs.version.outputs.tag != '' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.rel.outputs.tag }}

      - name: Set build date
        id: meta-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.rel.outputs.tag }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.rel.outputs.tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta-date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: final

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # All tags from the metadata step (including "latest") point at the same
      # manifest digest from the single multi-arch push above, so signing the
      # digest once covers every tag - there is no separate :latest push to sign.
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  trivy-scan:
    permissions:
      packages: read
    name: trivy scan
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
