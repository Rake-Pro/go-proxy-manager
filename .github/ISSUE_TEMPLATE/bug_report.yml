name: Bug report
description: Something is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check [CHANGELOG.md](../../CHANGELOG.md) for a recent
        fix, and [BACKLOG.md](../../BACKLOG.md) for a known, tracked gap.
  - type: input
    id: version
    attributes:
      label: gpm version
      description: From `GET /version` on the admin listener, or the image tag.
      placeholder: v1.0.31
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Docker / Docker Compose
        - Kubernetes
        - Bare metal / systemd
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: >
        The relevant object(s) from `config/` (proxy host, middleware,
        settings, ...). **Redact every secret value first**: replace
        `${ENV:...}` / `${FILE:...}` targets, tokens, and passwords with
        `REDACTED`. Do not paste `admin_hash` or any bearer token.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from stdout/stderr (zerolog JSON). Redact IPs,
        hostnames, and any header value that looks like a credential.
      render: text
  - type: input
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Smallest config/steps that reproduce it, if you have one.
