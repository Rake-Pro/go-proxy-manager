site_name: go-proxy-manager
site_description: >-
  A standalone ingress and proxy manager for homelabs and small sites: TLS and
  ACME, SSO and mTLS, access control, DNS publishing, Kubernetes and Docker
  discovery, git-backed config, a REST API and a web UI.
site_url: https://rake-pro.github.io/go-proxy-manager/
repo_url: https://github.com/Rake-Pro/go-proxy-manager
repo_name: Rake-Pro/go-proxy-manager
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: MIT licensed

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Install with Docker Compose: getting-started/install-docker.md
      - Install the binary: getting-started/install-binary.md
      - Your first host with HTTPS: getting-started/first-host-with-https.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Configuration model: concepts/config-model.md
      - Request pipeline: concepts/request-pipeline.md
      - Which mechanism do I use?: concepts/which-mechanism.md
      - Security model: concepts/security-model.md
      - Terminology: concepts/terminology.md
  - How-to:
      - Hosts and certificates:
