          - Wildcard over DNS-01 (Cloudflare): how-to/dns-01-cloudflare.md
          - DNS-01 for any nameserver: how-to/generic-dns01-rfc2136-acme-dns.md
      - Authentication:
          - Admin SSO (OIDC): how-to/admin-oidc-sso.md
          - Per-host SSO: how-to/per-host-sso.md
          - Basic auth: how-to/basic-auth.md
          - mTLS client certificates: how-to/mtls-client-certs.md
          - TOTP for the local admin: how-to/totp.md
          - Migrate access-list basic auth: how-to/migrate-basic-auth.md
      - Automation:
