              - TLS: reference/config/settings/tls.md
              - Security headers: reference/config/settings/security-headers.md
              - Error pages: reference/config/settings/error-pages.md
              - Maintenance mode: reference/config/settings/maintenance.md
              - DNS sync: reference/config/settings/dns-sync.md
              - Ingress discovery: reference/config/settings/ingress-discovery.md
