<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
// Applies a saved explicit theme choice before first paint, so a light/dark
// pick never flashes the other palette. "auto" (or unset) leaves no
// data-theme attribute and app.css's prefers-color-scheme media queries
// decide instead. Kept in sync with the gpm.theme key app.js reads/writes.
(function () {
  try {
    var t = localStorage.getItem('gpm.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* ignore */ }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Go Proxy Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>
<script type="module" src="app.js"></script>
</body>
</html>
