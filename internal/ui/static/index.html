<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Pre-paint theme guard. A separate file, not an inline block: the admin
     listener's Content-Security-Policy is script-src 'self', which blocks
     inline execution outright. Must stay before the app.css <link>. -->
<script src="theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Go Proxy Manager</title>
<!-- Fonts are served from this binary, never from a third party: the admin
     panel is routinely on an isolated management VLAN with no outbound
     internet, and a Google Fonts <link> also sent the operator's IP and
     Referer off-box on every page view. The three faces are vendored under
     static/fonts/ and @font-face'd from app.css, which is what lets the CSP
     stay style-src 'self' 'unsafe-inline'; font-src 'self'. -->
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>
<script type="module" src="app.js"></script>
</body>
</html>
