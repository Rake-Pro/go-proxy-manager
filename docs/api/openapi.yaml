  /api/certificates/{name}/renew:
    parameters:
    - $ref: '#/components/parameters/NamePath'
    post:
      summary: Force an immediate certificate renewal
      description: Starts an ACME order for this certificate now, ignoring the normal 30-day renewal
        window. Responds as soon as the order has STARTED, not once it completes - DNS-01 propagation
        alone can take minutes. Poll GET /certificates/{name}'s status fields (state, lastAttempt,
        lastError) to see the outcome. Only one order runs at a time across the whole instance; a
        second renew request while one is already in flight gets 409, not queued. A 1-hour cooldown
        also applies per certificate, counted from its last attempt - failed attempts included - so
        a retry loop cannot hammer the CA into a rate limit.
      tags:
      - Certificates
      responses:
        '200':
          description: The order was accepted and is now running in the background.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: boolean
                required:
                - started
        '400':
          description: This certificate is type custom, not acme. gpm does not renew custom certificates
            - replace the file and PUT the object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Refused for one of two reasons, both named in the error message: an ACME order
            is already in flight for this instance (this certificate or another one), or this
            certificate is within its 1-hour renew cooldown, counted from its last attempt whether
            that attempt succeeded or failed. The cooldown message states the remaining wait
            ("retry in 42m10s"). Wait and retry; nothing is queued.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: This instance is not the ACME issuer (an HA follower, or ACME is not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Unexpected error starting the order (rare - the request itself, not the order,
            failed). An order failure once running (CA rejection, DNS-01 propagation timeout) is NOT
            reported here; check the certificate's lastError status field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: certificates:write
