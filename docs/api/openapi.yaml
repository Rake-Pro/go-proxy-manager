    put:
      summary: Create or update an APIToken
      description: Creates or updates the named token. A new token (or an existing one re-PUT with ?rotate=1)
        mints a fresh secret server-side, returned exactly once as `token`/`tokenNote`. An ordinary edit
        (scopes, expiry, disabled) with no ?rotate carries the existing digest forward unchanged. TokenHash
        is never accepted from the client.
      tags:
      - API tokens
      parameters:
      - name: rotate
        in: query
        required: false
        description: 'api-tokens only: 1 mints a replacement secret, invalidating the old one immediately.'
        schema:
          type: string
          enum:
          - '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/FollowerReadOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: admin
    delete:
      summary: Delete an APIToken
      tags:
      - API tokens
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/FollowerReadOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: admin
