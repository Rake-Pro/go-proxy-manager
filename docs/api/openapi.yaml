      description: In-memory and per-process - an operational hint, never config. Every configured
        target is listed; one that has never fired has an empty lastAttempt.
      tags:
      - Webhooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: settings:read
  /api/webhooks/{name}/test:
    post:
      summary: Send a synthetic test event to one webhook target
      description: 'POSTs {"action":"test","kind":"Webhook","name":"<target>","time":"<RFC3339>"} and
        waits for the answer (5s timeout). A disabled target is still tested, so a receiver can be
        proved before it is turned on. A refused or timed-out delivery is a 200 with ok:false - only
        an unknown target name is a 404. Admin scope: it makes gpm POST to an admin-configured URL on
        demand and resolves that target''s secret.'
      tags:
      - Webhooks
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The test ran; see ok/error for what the receiver did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No webhook target with that name is configured.
        '501':
          description: Webhook delivery is not wired in this deployment.
      x-scope: admin
  /api/notifications/status:
    get:
      summary: Last-delivery state per notification target
      description: In-memory and per-process - an operational hint, never config. Every configured
        target is listed; one that has never fired has an empty lastAttempt. Same shape as
        /api/webhooks/status (internal/notify reuses webhook.Delivery).
      tags:
