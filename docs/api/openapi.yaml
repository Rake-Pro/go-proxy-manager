      additionalProperties:
        type: object
        properties:
          upstream:
            type: string
            description: scheme://host:port
          healthy:
            type: boolean
          weight:
            type: integer
          active:
            type: integer
            description: In-flight request count.
    Logs:
      type: object
      properties:
        enabled:
          type: boolean
          description: False, with an empty entries array, when no access-log viewer is wired.
        entries:
          type: array
          items:
            type: object
            properties: {}
