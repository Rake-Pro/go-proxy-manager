  /auth/callback:
    get:
      summary: OIDC authorization-code callback
      description: Verifies state against the login cookie, exchanges the code, establishes the session,
        and redirects to the original return path.
      tags:
      - Auth
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
        description: Set by the IdP on a failed/denied authorization.
      responses:
        '302':
          description: Redirect to the original return path, with the session cookie set.
        '400':
          description: Missing state/code, or the state does not match the login cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The IdP reported an error, or the code exchange / identity checks failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/local:
    post:
      summary: Local username/password login
      description: 'Same-origin only (CSRF belt: no session exists yet for a token-based defense). Rate-limited
        per client IP.'
      tags:
      - Auth
      responses:
        '302':
          description: Redirect to the return path, with the session cookie set.
        '403':
          description: Cross-origin request blocked (failed the same-origin guard).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many recent failed attempts from this client IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Bad credentials, or local login is disabled/not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                return:
                  type: string
                  description: Same-site path to redirect to on success.
  /auth/login:
    get:
      summary: Start (or choose) an admin login flow
      description: With ?idp=<name>, redirects straight to that IdentityProvider's OIDC flow. With none,
        renders an HTML chooser (SSO providers + local login form), unless exactly one SSO provider is
        configured and local login is off, in which case it redirects immediately (?select=1 forces the
        chooser, used by logout).
      tags:
      - Auth
      parameters:
      - name: idp
        in: query
        required: false
        schema:
          type: string
        description: IdentityProvider name to start an OIDC redirect immediately.
      - name: return
        in: query
        required: false
        schema:
          type: string
        description: Same-site path to return to after login. Anything else (open-redirect shapes) is
          discarded in favour of "/".
      - name: select
        in: query
        required: false
        schema:
          type: string
        description: Any non-empty value forces the chooser page even with a single SSO provider.
      responses:
        '200':
          description: HTML login chooser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect to the IdP's authorization endpoint.
        '502':
          description: The IdP could not be reached to start the flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/logout:
    post:
      summary: End the current admin session
      description: Same-origin only. Redirects to the login chooser (?select=1) rather than bouncing straight
        back into a still-live IdP session.
      tags:
      - Auth
      responses:
        '302':
          description: Redirect to /auth/login?select=1, with the session cookie cleared.
        '403':
          description: Cross-origin request blocked (failed the same-origin guard).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /debug/pprof/:
    get:
      summary: pprof index
      description: Only mounted when the instance is started with GPM_PPROF=1 (-pprof); a 404 here means
        profiling is off, not that this route doesn't exist. Gated by admin role, the same-origin guard,
        AND (unlike every other admin route) an explicit `admin` API-token scope check - a resource-scoped
        token gets 403, because a heap dump or /debug/pprof/cmdline carries resolved backend credentials
        in cleartext. `go tool pprof <url>` direct remote-attach does not work (no cookie, and its /debug/pprof/symbol
        POST fails CSRF); download the profile with curl -b and run pprof against the local file.
      tags:
      - Profiling (opt-in)
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
