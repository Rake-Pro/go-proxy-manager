paths:
  /api/access-list-sources/reconcile:
    post:
      summary: Fetch every due access-list source now
      description: 'Synchronous. Never queues: a run already in flight answers 409 instead of blocking.
        A source whose fetch is refused (non-200, empty body, over maxEntries, any unparseable line)
        keeps its previously fetched set.'
      tags:
      - Access lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessListSourceStatus'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          description: The ledger could not be read or written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: access-lists:write
  /api/access-list-sources/status:
