      description: Replaces the current config, validates the result, and commits it as one revision.
        If the archive yields an invalid config (including a literal, uncommittable secret) the working
        tree is rolled back to HEAD and nothing is committed. Max 8MB gzipped body.
      tags:
      - Backup & restore
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/FollowerReadOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: admin
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
  /api/revert:
    post:
      summary: Revert the whole config to a past commit
      description: Recorded as a new commit, so the revert is itself revertible. Rewrites every object,
        so it needs admin scope for a token principal.
      tags:
      - Meta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRef'
      responses:
        '200':
