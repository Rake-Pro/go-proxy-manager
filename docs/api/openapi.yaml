  /api/client-cas/{name}/issue:
    parameters:
    - $ref: '#/components/parameters/NamePath'
    post:
      summary: Issue a client certificate from this ClientCA
      description: Mints an RSA-2048 client certificate signed by the CA's configured signing key
        (caKeyFile / caKeyPEM) and returns it as a password-protected PKCS#12 bundle. RSA and the
        legacy PKCS#12 encoder are deliberate - iOS and some Android/Wear releases reject ECDSA client
        certificates and PBES2 bundles. The generated private key is never persisted or logged; it
        exists only in the response body, so a lost bundle means re-issuing. Nothing in the config
        changes, so unlike every other write this route creates no revision and no history entry.
      tags:
      - Client CAs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCertRequest'
      responses:
        '200':
          description: The PKCS#12 bundle. Content-Disposition names it after the sanitized common name.
          headers:
            Content-Disposition:
              description: attachment; filename="<sanitized-cn>.p12"
              schema:
                type: string
            X-Client-Cert-Serial:
              description: Serial number of the issued certificate, lower-case hex.
              schema:
                type: string
          content:
            application/x-pkcs12:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: This ClientCA is verify-only - it has no caKeyFile / caKeyPEM, so it cannot issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The certificate was signed but could not be recorded (no certificate store is
            configured, or it is unwritable), so it was NOT issued and no bundle is returned. Also
            covers a signing key that is configured but unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/FollowerReadOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: client-cas:write
  /api/client-cas/{name}/generate:
    parameters:
    - $ref: '#/components/parameters/NamePath'
    post:
      summary: Generate a new self-signed ClientCA
      description: Creates a complete, issuance-capable client CA from nothing, so an mTLS setup needs
        no openssl and no hand-placed key file. Generates an RSA-4096 self-signed CA (CA:TRUE with
        pathlen:0, keyUsage certSign+cRLSign, random serial, small backdate), writes the private key
        into the managed certificate store at "client-cas/{name}.key" with mode 0600, and saves the
        ClientCA object with that path as caKeyFile and the certificate inline as caPEM. Unlike
        POST /issue this DOES mutate config - it goes through the normal store save, so it commits and
        appears in object history exactly like a PUT, and the response is the created object. The
        private key is never returned and never logged. A key file another ClientCA still references is
        never overwritten (409); an unreferenced one is reclaimed. A failed config save removes the key
        it just wrote so the name can be retried. Deleting the ClientCA later does NOT delete the key
        file - see docs/configuration.md.
      tags:
      - Client CAs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCAGenerateRequest'
      responses:
        '200':
          description: The created ClientCA, exactly as PUT would return it. Carries the certificate and
            the key path, never the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A ClientCA of this name already exists, or a key file for it is already present in
            the certificate store AND another ClientCA still names it as its caKeyFile (the error names
            that CA). Nothing on disk changes. An UNREFERENCED key file is not a conflict - it is
            reclaimed and replaced, since it can only be residue from a crash or from a deleted CA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Key generation or the certificate-store write failed, or no certificate store is
            configured. No ClientCA is created. Note a failure of the config-store save afterwards
            surfaces as 400, per this API's convention for a rejected write, and the key just written is
            removed so the name can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/FollowerReadOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: client-cas:write
  /api/client-cas/{name}/certificates:
    parameters:
    - $ref: '#/components/parameters/NamePath'
    get:
      summary: List the client certificates this ClientCA has issued
      description: Runtime state, not config - it records what gpm issued, never what the operator
        declared, so it lives in the certificate store rather than the git-backed config repo and
        appears in no revision. Each record carries the subject, SANs, serial and validity window plus
        a status derived from the CA's expiryWarningDays; it never carries key material, and gpm keeps
        no copy of the certificate or its PKCS#12 bundle. A superseded record (renewed) stays listed
        until it expires, because the certificate it names is still valid on every device holding it.
      tags:
      - Client CAs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedClientCertList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: client-cas:read
  /api/client-cas/{name}/certificates/{serial}/renew:
    parameters:
    - $ref: '#/components/parameters/NamePath'
    - name: serial
      in: path
      required: true
      description: Serial of the issued certificate to renew, lower-case hex, as reported by the list.
      schema:
        type: string
    post:
      summary: Renew one issued client certificate
      description: Reissues the identity already on record - the same common name and SANs, which are
        deliberately NOT accepted from the client - with a brand-new private key and serial, and marks
        the old record superseded by the new one. The response is a PKCS#12 bundle exactly like
        POST /issue. Renewing does NOT revoke the old certificate - revocation stays CRL-based
        (ClientCA.crlFile / crlPEM) - so every device still holding the old bundle keeps working until
        it expires. There is no client-side renewal - each device must import the new .p12 by hand.
      tags:
      - Client CAs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCertRenewRequest'
      responses:
        '200':
          description: The renewed PKCS#12 bundle.
          headers:
            Content-Disposition:
              description: attachment; filename="<sanitized-cn>.p12"
              schema:
                type: string
            X-Client-Cert-Serial:
              description: Serial number of the renewed certificate, lower-case hex.
              schema:
                type: string
          content:
            application/x-pkcs12:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No such ClientCA, or no issued certificate with that serial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This certificate was already renewed. The error names the serial that superseded
            it - renew that certificate instead. Renewing a superseded record again would mint a second
            live certificate for one identity and rewrite the supersede link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: This ClientCA is verify-only - its signing key was removed since the certificate
            was issued, so it cannot renew.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The certificate was signed but could not be recorded (no certificate store is
            configured, or it is unwritable), so it was NOT issued and no bundle is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/FollowerReadOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: client-cas:write
