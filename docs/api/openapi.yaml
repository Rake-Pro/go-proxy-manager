      summary: Send a synthetic test notification to one target
      description: 'Sends a synthetic event and waits for the answer (5s timeout), bypassing the
        target''s events filter and the dedup window. A disabled target is still tested, so a
        receiver can be proved before it is turned on. A refused or timed-out delivery is a 200
        with ok:false - only an unknown target name is a 404. Admin scope: it makes gpm POST to an
        admin-configured URL on demand and resolves that target''s secret.'
      tags:
      - Notifications
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The test ran; see ok/error for what the receiver did.
          content:
