      x-scope: access-lists:write
  /api/access-lists/{name}/migrate-basic-auth:
    parameters:
    - $ref: '#/components/parameters/NamePath'
    post:
      summary: Migrate an AccessList's deprecated basicAuth to an auth middleware
      description: 'Creates an auth middleware named "<name>-basic" with mode basic from the list''s
        basicAuth users, attaches it to every proxy host and location that references the list, copies
        the list''s literal allow CIDRs to the middleware''s allowFrom ONLY when satisfyAny was set (the
        sole configuration in which an IP match alone admitted a request), and clears basicAuth and
        satisfyAny on the list - all in a single commit. When every rule moved, the list is also
        DETACHED from those hosts and locations (see detachAccessList): with satisfyAny it admitted on
        "IP match OR password", so leaving its rules attached would make them mandatory. Source-backed
        and path-scoped allow rules are not copied and are reported in warnings. Admin-scoped because one call rewrites access lists,
        middlewares and proxy hosts together. Add ?plan=1 for a dry run that returns the same payload
        and changes nothing.'
      tags:
      - Access lists
      parameters:
      - name: plan
        in: query
        required: false
        description: Set to 1 for a dry run. Nothing is written and the response carries no commit.
        schema:
          type: string
          enum:
          - '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicAuthMigration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/FollowerReadOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
