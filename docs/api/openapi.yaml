    get:
      summary: Liveness probe
      tags:
      - Meta
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
      security: []
  /metrics:
    get:
      summary: Prometheus metrics exposition
      description: Only mounted when the instance is started with GPM_METRICS=1 (-metrics); a 404 here
        means metrics are off, not that this route doesn't exist. Gated by admin role plus a `metrics:read`
        API-token scope check (an admin session needs no scope). The body is Prometheus text exposition
        format 0.0.4, namespaced `gpm_`; host labels are ProxyHost/StreamHost NAMES from the committed
        config, never client-supplied Host headers, and series count is capped per metric. It names hosts
        and certificates, so it is admin data - do not expose the admin listener to scrape it, scrape it
        over your own private path.
      tags:
      - Metrics (opt-in)
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP gpm_http_requests_total Data-plane HTTP requests, by proxy host, method and status class.
                  # TYPE gpm_http_requests_total counter
                  gpm_http_requests_total{host="app",method="GET",status="2xx"} 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /version:
    get:
      summary: Build identity
      tags:
      - Meta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
      security: []
