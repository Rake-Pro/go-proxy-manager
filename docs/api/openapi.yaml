            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session cookie or bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but the caller's role or API-token scope does not permit this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No object of this kind with this name exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Delete refused because another object still references this one, or a reconcile is
        already in flight.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FollowerReadOnly:
      description: This instance is an HA follower (GPM_HA_ROLE=follower) and refuses every write; make
        the change on the leader.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
